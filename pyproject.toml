[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-mail-assistant"
version = "0.1.0"
description = "Personal recruiting email automation for QQ Mail, Feishu Base, and iCloud Calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "caldav>=2.0,<4",
  "chinesecalendar>=1.11,<2",
  "httpx>=0.27,<1",
  "icalendar>=6.1,<7",
  "openai>=1.70,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
